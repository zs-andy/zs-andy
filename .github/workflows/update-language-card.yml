name: Update language card

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-language-card.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-language-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test generator and README contracts
        run: node --test scripts/*.test.mjs
      - name: Generate cards
        run: node scripts/update-language-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated cards
        run: |
          if git diff --quiet -- assets; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages-*.svg assets/language-data.json
          git commit -m "Update language composition"
          git pull --rebase origin main
          git push origin HEAD:main
